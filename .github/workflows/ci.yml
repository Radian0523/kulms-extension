name: CI

on:
  pull_request:
    branches: [main]

# PR のコードを動かすジョブなので、読み取りの権限だけを与える
# （担当者の自動付与は auto-assign.yml に分けた）
permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx eslint .
